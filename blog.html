<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>또박이 글쓰기 블로그</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fff7ec">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7ec;--card:#fff;--ink:#2b2622;--sub:#7a6f66;--line:#eadfce;--accent:#ff7a45;--soft:#fff0e3}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Gowun Dodum",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.7}
h1,h2,h3{font-family:Jua,sans-serif;font-weight:400;line-height:1.3}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 60px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header h1{margin:0;font-size:26px}
header a{color:inherit;text-decoration:none}
.sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border-radius:18px;box-shadow:0 4px 14px rgba(120,80,30,.10);padding:18px;margin:0 0 14px}
.item{display:flex;gap:12px;align-items:center;cursor:pointer;text-decoration:none;color:inherit}
.item h3{margin:0 0 4px;font-size:20px}
.chips span{display:inline-block;background:var(--soft);border-radius:999px;padding:2px 10px;font-size:14px;margin:2px 4px 2px 0}
button,.btn{font:inherit;font-family:Jua,sans-serif;font-size:17px;border:0;border-radius:14px;padding:12px 16px;cursor:pointer;background:var(--accent);color:#fff;min-height:46px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button.ghost,.btn.ghost{background:var(--soft);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2622;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;display:none}
.muted{color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <header><div style="font-size:34px">📰</div><div><h1><a href="/blog.html">또박이 글쓰기 블로그</a></h1><div class="sub">울 · 펄 · 밍의 오늘의 글쓰기 기록</div></div></header>
  <main id="app"><div class="card muted">불러오는 중…</div></main>
</div>
<div class="toast" id="toast"></div>
<script src="/shared.js"></script>
<script>
const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
let POSTS = [];

function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.style.display = "block"; setTimeout(() => (t.style.display = "none"), 2200); }

function listView() {
  if (!POSTS.length) return `<div class="card muted">아직 올라온 글이 없어요. 시상식을 마치면 자동으로 올라와요.</div>`;
  return POSTS.map((p) => `<a class="card item" href="?id=${encodeURIComponent(p.id)}">
    ${badgeSVG(p.topic.badge, null, 64)}
    <div><div class="sub">${esc(p.date)}</div><h3>${esc(p.topic.title)}</h3>
    <div class="chips">${p.people.map((x) => `<span>${esc(x.id)} ${({ gold: "🥇", silver: "🥈", bronze: "🥉" })[x.medal || x.award] || ""}</span>`).join("")}</div></div></a>`).join("");
}
function postView(p) {
  return `<div class="card">
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px">${p.people.filter((x) => x.award === "gold").map((x) => `<div style="text-align:center">${badgeSVG(p.topic.badge, "gold", 70)}<div class="sub">${esc(x.id)}</div></div>`).join("")}</div>
    <div id="body">${postBodyHTML(p)}</div>
  </div>
  <div class="card">
    <div class="row"><button id="copyBtn">📋 네이버 블로그용 복사</button><button class="ghost" id="printBtn">🖨️ A5로 인쇄</button></div>
    <p class="sub" style="margin:10px 0 0">복사한 뒤 네이버 블로그(또는 티스토리) 글쓰기 화면에 붙여 넣으면 그대로 올라가요.</p>
  </div>
  <a class="btn ghost" style="width:100%" href="/blog.html">← 글 목록</a>`;
}
async function copyRich(html, text) {
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({ "text/html": new Blob([html], { type: "text/html" }), "text/plain": new Blob([text], { type: "text/plain" }) })]);
      return true;
    }
  } catch {}
  const r = document.createRange(); const el = document.getElementById("body"); r.selectNodeContents(el);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  const ok = document.execCommand("copy"); sel.removeAllRanges(); return ok;
}
function printA5(post) {
  document.body.innerHTML = `<style>${A5_CSS} body{margin:0;background:#eee} @media screen{.a5page{margin:10px auto;box-shadow:0 2px 8px rgba(0,0,0,.15)}}</style>${a5HTML(post)}`;
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => print(), 400));
}

(async () => {
  try {
    const r = await fetch("/api/blog"); const d = await r.json();
    if (d.error) throw new Error(d.error);
    POSTS = d.posts || [];
  } catch (e) { app.innerHTML = `<div class="card">😢 ${esc(e.message)}</div>`; return; }
  const id = params.get("id");
  const post = id && POSTS.find((p) => p.id === id);
  if (id && !post) { app.innerHTML = `<div class="card muted">글을 찾을 수 없어요.</div><a class="btn ghost" href="/blog.html">← 글 목록</a>`; return; }
  if (post && params.get("print")) return printA5(post);
  if (post) {
    document.title = `${post.topic.title} · 또박이 글쓰기 블로그`;
    app.innerHTML = postView(post);
    document.getElementById("copyBtn").onclick = async () => {
      const ok = await copyRich(postBodyHTML(post), document.getElementById("body").innerText);
      toast(ok ? "복사했어요! 블로그 글쓰기에 붙여 넣으세요." : "복사하지 못했어요. 글을 길게 눌러 직접 복사해 주세요.");
    };
    document.getElementById("printBtn").onclick = () => { location.search = `?id=${encodeURIComponent(post.id)}&print=1`; };
    return;
  }
  app.innerHTML = listView();
})();
</script>
</body>
</html>
