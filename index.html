<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>가족 글쓰기 로봇</title>
<meta name="theme-color" content="#fff7ec">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✏️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7ec; --card:#ffffff; --ink:#2b2622; --sub:#7a6f66; --line:#eadfce;
  --accent:#ff7a45; --accent-ink:#ffffff; --soft:#fff0e3; --good:#2f9e6b; --warn:#d9480f;
  --pearl:#e86a92; --wool:#3b82c4; --ming:#f59f00;
  --gold:#f5b301; --silver:#a9b4bf; --challenge:#3fb57a;
  --radius:18px; --shadow:0 4px 14px rgba(120,80,30,.10);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3,.jua{font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400;line-height:1.3}
h1{font-size:28px;margin:0}
h2{font-size:23px;margin:0 0 10px}
h3{font-size:19px;margin:0 0 6px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 96px}
header.top{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
header.top .robot{font-size:34px}
header.top .sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin:0 0 14px}
.muted{color:var(--sub)}
.small{font-size:14px}
button,.btn{font:inherit;border:0;border-radius:14px;padding:13px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-family:"Jua",sans-serif;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px}
button.ghost{background:var(--soft);color:var(--ink)}
button.line{background:transparent;border:2px solid var(--line);color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
button.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 auto}
input[type=text],input[type=password],textarea{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#fffdf9;color:var(--ink)}
textarea{min-height:72px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
label.q{display:block;margin:14px 0 6px;font-weight:700}
.tabs{display:flex;gap:8px;margin:0 0 12px}
.tab{flex:1;padding:10px 6px;border-radius:14px;background:var(--soft);color:var(--ink);font-family:"Jua";font-size:18px;text-align:center;cursor:pointer;border:3px solid transparent;min-height:auto}
.tab.on{border-color:currentColor;background:#fff}
.p-펄{color:var(--pearl)} .p-울{color:var(--wool)} .p-밍{color:var(--ming)}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--soft);font-size:14px;margin:2px 4px 2px 0}
.chip.done{background:#e3f6ec;color:var(--good)}
.steps{display:flex;gap:6px;margin:0 0 14px}
.steps span{flex:1;height:8px;border-radius:8px;background:var(--line)}
.steps span.on{background:var(--accent)}
.topic-title{font-size:26px;margin:4px 0 8px}
.badge-wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.badge-wrap svg{flex:0 0 auto}
.guide-part{border-left:6px solid var(--accent);padding:6px 0 6px 12px;margin:12px 0}
.guide-part.intro{border-color:#ff9f68}.guide-part.cause{border-color:#7c9cff}.guide-part.solution{border-color:#3fb57a}.guide-part.conclusion{border-color:#c77dff}
.starter{background:var(--soft);border-radius:10px;padding:6px 10px;margin:6px 0;font-size:15px}
.score-bar{height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.score-bar i{display:block;height:100%;background:var(--accent)}
.score-row{display:grid;grid-template-columns:110px 1fr 54px;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.transcript{white-space:pre-wrap;background:#fffdf6;border:2px dashed var(--line);border-radius:12px;padding:12px;font-size:16px}
.transcript mark{background:#ffd8a8;border-radius:4px}
.total{font-family:"Jua";font-size:40px;color:var(--accent)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.thumbs img{width:84px;height:110px;object-fit:cover;border-radius:10px;border:2px solid var(--line)}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:10px 0 4px;text-align:center}
.podium .pl{flex:1;max-width:200px}
.podium .stand{border-radius:12px 12px 0 0;color:#fff;font-family:"Jua";font-size:22px;padding:8px 0}
.grid-badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.grid-badges .b{text-align:center;font-size:13px;color:var(--sub)}
.notice{background:#fff3bf;border-radius:12px;padding:10px 12px;font-size:15px;margin:0 0 12px}
.err{background:#ffe3e3;color:#a61e1e;border-radius:12px;padding:10px 12px;font-size:15px;margin:10px 0}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:#fffaf3;border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.bottom button{flex:1;max-width:180px;background:transparent;color:var(--sub);font-size:15px;flex-direction:column;gap:0;min-height:52px;padding:4px}
nav.bottom button b{font-size:22px;line-height:1.1}
nav.bottom button.on{color:var(--accent)}
.spinner{display:inline-block;width:22px;height:22px;border:3px solid rgba(0,0,0,.12);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:26px 10px}
.loading .big{font-size:46px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.toggle{display:flex;align-items:center;gap:10px;background:var(--soft);padding:10px 12px;border-radius:12px;cursor:pointer}
.toggle input{width:22px;height:22px}
.rate{font-family:"Jua";font-size:20px}
ul.clean{margin:6px 0;padding-left:20px}
@media (max-width:420px){ h1{font-size:24px} .topic-title{font-size:22px} .score-row{grid-template-columns:92px 1fr 48px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="robot">🤖</div>
    <div><h1>가족 글쓰기 로봇</h1><div class="sub">울 · 펄 · 밍의 오늘의 글쓰기</div></div>
  </header>
  <div id="storeNotice"></div>
  <main id="app"></main>
</div>
<nav class="bottom" id="nav">
  <button data-go="home"><b>🏠</b>오늘</button>
  <button data-go="badges"><b>🏅</b>배지함</button>
  <button data-go="history"><b>📚</b>기록</button>
  <button data-go="help"><b>❓</b>쓰는 법</button>
</nav>

<script>
/* ===================== 기본 설정 ===================== */
const PEOPLE = [
  { id: "울", role: "아빠", level: "adult" },
  { id: "펄", role: "엄마", level: "adult" },
  { id: "밍", role: "민결", level: "child" },
];
const MING_TARGET = 0.7;
const SCORE_LABELS = { structure: ["짜임", 25], content: ["내용", 25], sentence: ["문단·문장", 20], spelling: ["맞춤법", 15], handwriting: ["글씨", 15] };
const PART_LABELS = { intro: "서론", cause: "본론① 원인", solution: "본론② 해결", conclusion: "결론" };

const FIXED_Q = [
  { k: "weather", q: "오늘 날씨는 어땠나요? 날씨 때문에 생긴 일이 있었나요?" },
  { k: "mood", q: "오늘 기분은 어때요? 왜 그런 기분이 들었나요?" },
];
const POOL_Q = [
  "요즘 가장 관심 있는 것은 무엇인가요?",
  "요즘 불편하거나 속상했던 일이 있었나요?",
  "이번 주에 가장 기억에 남는 일은 무엇인가요?",
  "요즘 고치고 싶은 습관이 있나요?",
  "우리 집에서 바뀌었으면 하는 점이 있나요?",
  "학교나 회사, 동네에서 '이건 문제야!' 하고 느낀 일이 있나요?",
  "요즘 가족에게 고마웠던 일이나 서운했던 일은 무엇인가요?",
  "요즘 자주 하는 놀이나 취미는? 그러다 생긴 문제는 없었나요?",
  "뉴스나 책에서 본 이야기 중 기억나는 것이 있나요?",
  "겨울이라서 좋은 점이나 힘든 점은 무엇인가요?",
  "요즘 친구나 동료와 있었던 일 중 기억나는 것은?",
  "요즘 시간이 부족하다고 느낀 적이 있나요? 왜 그랬나요?",
];
const STARTERS = {
  child: {
    intro: ["요즘 ○○ 때문에 문제가 생겼다.", "나는 이 문제를 보고 ○○한 기분이 들었다.", "그래서 이 문제의 까닭과 해결 방법을 생각해 보았다."],
    cause: ["이 문제가 생긴 까닭은 첫째, ○○ 때문이다.", "둘째, ○○ 때문이다."],
    solution: ["이 문제를 해결하려면 첫째, ○○해야 한다.", "왜냐하면 ○○이기 때문이다.", "예를 들어 ○○.", "둘째, ○○하면 좋겠다."],
    conclusion: ["정리하면, ○○.", "앞으로 나는 이 문제가 다시 생기지 않도록 ○○하겠다."],
  },
  adult: {
    intro: ["최근 ○○라는 문제를 겪으며 ○○라고 느꼈다.", "이 글에서는 원인을 살피고 해결책을 제안하고자 한다."],
    cause: ["가장 근본적인 원인은 ○○이다.", "여기에 ○○라는 요인이 더해졌다."],
    solution: ["첫째, ○○해야 한다. 그 이유는 ○○이다.", "둘째, ○○. 예컨대 ○○."],
    conclusion: ["요컨대 ○○.", "같은 문제가 반복되지 않도록 앞으로 ○○하겠다."],
  },
};

/* ===================== 유틸 ===================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function seededPick(arr, n, seed) {
  let h = 0; for (const c of seed) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { h = (h * 1103515245 + 12345) >>> 0; const j = h % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, n);
}
function safeColor(c, d) { return /^#[0-9a-fA-F]{6}$/.test(c || "") ? c : d; }

/* ===================== 서버 통신 ===================== */
let familyCode = ls.get("fwr_code", "");
let remoteStore = null; // true: 가족 공용 저장소, false: 이 기기만
async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...body, code: familyCode }) });
  let data = {};
  try { data = await r.json(); } catch { throw new Error(r.status === 413 ? "사진이 너무 커요. 사진 수를 줄여 주세요." : `서버 응답 오류 (${r.status})`); }
  if (!r.ok) { const e = new Error(data.error || `오류 (${r.status})`); e.status = r.status; throw e; }
  return data;
}
const store = {
  async list() {
    if (remoteStore) { const d = await api("/api/data", { action: "list" }); return d.sessions || []; }
    return ls.get("fwr_sessions", []);
  },
  async get(id) {
    if (remoteStore) { const d = await api("/api/data", { action: "get", id }); return d.session; }
    return ls.get("fwr_sessions", []).find((s) => s.id === id) || null;
  },
  async save(s) {
    s.updatedAt = Date.now();
    if (remoteStore) return api("/api/data", { action: "save", session: s });
    const all = ls.get("fwr_sessions", []).filter((x) => x.id !== s.id); all.push(s); ls.set("fwr_sessions", all);
  },
  async remove(id) {
    if (remoteStore) return api("/api/data", { action: "delete", id });
    ls.set("fwr_sessions", ls.get("fwr_sessions", []).filter((x) => x.id !== id));
  },
};

/* ===================== 배지 그림 ===================== */
const TIER = { gold: { c: "#f5b301", t: "1등" }, silver: { c: "#a9b4bf", t: "2등" }, challenge: { c: "#3fb57a", t: "도전" } };
function starPts(cx, cy, R, r, n = 5) { const p = []; for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n; const rad = i % 2 ? r : R; p.push(`${(cx + rad * Math.cos(a)).toFixed(1)},${(cy + rad * Math.sin(a)).toFixed(1)}`); } return p.join(" "); }
function badgeSVG(b, tier, size = 110) {
  b = b || {}; const id = "g" + Math.random().toString(36).slice(2, 9);
  const c1 = safeColor(b.color1, "#ffb86b"), c2 = safeColor(b.color2, "#ff7a45");
  const T = TIER[tier] || null; const ring = T ? T.c : "#d9cbb8";
  const shapes = {
    circle: `<circle cx="60" cy="56" r="42"/>`,
    hexagon: `<polygon points="60,12 98,34 98,78 60,100 22,78 22,34"/>`,
    shield: `<path d="M60 12 L98 25 V56 C98 80 81 94 60 102 C39 94 22 80 22 56 V25 Z"/>`,
    star: `<polygon points="${starPts(60, 58, 48, 30)}"/>`,
    flower: `<g>${[0, 60, 120, 180, 240, 300].map((a) => `<circle cx="${(60 + 24 * Math.cos(a * Math.PI / 180)).toFixed(1)}" cy="${(56 + 24 * Math.sin(a * Math.PI / 180)).toFixed(1)}" r="20"/>`).join("")}<circle cx="60" cy="56" r="26"/></g>`,
  };
  const shape = shapes[b.shape] || shapes.circle;
  return `<svg width="${size}" height="${size * 1.18}" viewBox="0 0 120 142" role="img" aria-label="${esc((b.name || "배지") + (T ? " " + T.t : ""))}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    ${T ? `<path d="M40 88 L30 136 L46 126 L56 138 L60 94 Z" fill="${ring}" opacity=".9"/><path d="M80 88 L90 136 L74 126 L64 138 L60 94 Z" fill="${ring}" opacity=".75"/>` : ""}
    <g fill="${ring}" transform="translate(60 56) scale(1.13) translate(-60 -56)">${shape}</g>
    <g fill="url(#${id})">${shape}</g>
    <text x="60" y="70" text-anchor="middle" font-size="40">${esc(b.emoji || "✏️")}</text>
    ${T ? `<rect x="36" y="${b.shape === "star" ? 98 : 92}" width="48" height="20" rx="10" fill="#fff" stroke="${ring}" stroke-width="3"/><text x="60" y="${b.shape === "star" ? 113 : 107}" text-anchor="middle" font-size="12" font-weight="700" fill="#333" font-family="Jua, sans-serif">${T.t}</text>` : ""}
  </svg>`;
}

/* ===================== 상태 ===================== */
let S = { view: "home", session: null, tab: "밍", busy: false, err: "" };
function setErr(m) { S.err = m || ""; }
function errBox() { return S.err ? `<div class="err">${esc(S.err)}</div>` : ""; }

function newSession() {
  const date = todayStr();
  const qs = [...FIXED_Q, ...seededPick(POOL_Q, 3, date + Math.random()).map((q, i) => ({ k: "p" + i, q }))];
  return { id: date + "-" + Math.random().toString(36).slice(2, 7), date, status: "interview", questions: qs, answers: {}, topic: null, entries: {}, awards: null, createdAt: Date.now() };
}

/* ===================== 화면: 가족 코드 ===================== */
function viewCode() {
  return `<div class="card"><h2>🔒 가족 코드</h2>
    <p class="muted">우리 가족만 쓸 수 있도록 가족 코드를 넣어 주세요. 한 번 넣으면 이 기기에 기억돼요.</p>
    <input id="codeIn" type="password" inputmode="numeric" autocomplete="off" placeholder="가족 코드">
    ${errBox()}
    <div style="margin-top:12px"><button class="block" id="codeOk">들어가기</button></div></div>`;
}
async function tryCode(code) {
  familyCode = code.trim();
  const d = await api("/api/data", { action: "ping" });
  ls.set("fwr_code", familyCode);
  remoteStore = !!d.configured;
  renderNotice();
}
function renderNotice() {
  $("#storeNotice").innerHTML = remoteStore === false
    ? `<div class="notice">💾 지금은 가족 공용 저장소가 연결되지 않아 <b>이 기기에만</b> 기록이 저장돼요.</div>` : "";
}

/* ===================== 화면: 홈 ===================== */
async function viewHome() {
  const all = await store.list();
  const open = all.filter((s) => s.status !== "done").sort((a, b) => b.createdAt - a.createdAt)[0];
  const done = all.filter((s) => s.status === "done");
  return `
  ${open ? `<div class="card"><h2>✏️ 진행 중인 글쓰기</h2>
     <p>${esc(open.date)} · ${open.topic ? `<b>${esc(open.topic.title)}</b>` : "인터뷰 중"}</p>
     <p class="small muted">${stageText(open)}</p>
     <div class="row"><button data-open="${esc(open.id)}">이어하기</button></div></div>` : ""}
  <div class="card">
    <h2>🤖 오늘의 글쓰기 시작</h2>
    <p class="muted">로봇이 몇 가지 질문을 하면 울, 펄, 밍이 답해 주세요. 답을 듣고 오늘의 주제와 오늘만의 배지를 정해 줄게요.</p>
    <button class="block" id="startNew">새 글쓰기 시작하기</button>
  </div>
  <div class="card">
    <h2>🏅 배지 현황</h2>
    <div class="row">${PEOPLE.map((p) => { const n = countBadges(done, p.id); return `<div style="text-align:center"><div class="jua p-${p.id}" style="font-size:22px">${p.id}</div><div class="small muted">${p.role}</div><div class="jua" style="font-size:20px">🥇${n.gold} 🥈${n.silver}${p.id === "밍" ? ` 🌱${n.challenge}` : ""}</div></div>`; }).join("")}</div>
  </div>`;
}
function stageText(s) {
  if (s.status === "interview") return "1단계: 인터뷰에 답하는 중";
  if (s.status === "writing") { const d = PEOPLE.filter((p) => s.entries[p.id]?.result).map((p) => p.id); return `2단계: 글쓰기·사진 제출 중 (제출: ${d.join(", ") || "아직 없음"})`; }
  return "";
}

/* ===================== 화면: 인터뷰 ===================== */
function viewInterview() {
  const s = S.session; const p = S.tab;
  const a = s.answers[p] || {};
  const doneCount = PEOPLE.filter((x) => Object.values(s.answers[x.id] || {}).some((v) => v && v.trim())).length;
  return `<div class="steps"><span class="on"></span><span></span><span></span><span></span></div>
  <div class="card">
    <h2>🎤 오늘의 인터뷰</h2>
    <p class="small muted">한 사람씩 이름을 누르고 답해 주세요. 짧게 써도 괜찮아요. (휴대폰 키보드의 🎤 버튼으로 말로 입력해도 돼요)</p>

function beginnerGuide(p, t, level) {

    cause: level === "child" ? "그 문제가 왜 생겼을까요? 까닭을 1~2가지 찾아요." : "표면적 이유보다 근본 원인을 1~2가지 분석합니다.",
    solution: level === "child" ? "어떻게 하면 해결될까요? 방법을 쓰고 꼭 '왜냐하면'으로 이유를 붙여요." : "원인에 대응하는 해결책을 이유·예시와 함께 제시합니다.",
    conclusion: level === "child" ? "앞의 내용을 한 줄로 정리하고, 다시 이런 문제가 안 생기게 앞으로 어떻게 할지 다짐해요." : "요약하고 재발 방지를 위한 실천 계획으로 마무리합니다.",
  }[k];
  return `<div class="steps">${keys.map((_, i) => `<span class="${i <= step ? "on" : ""}"></span>`).join("")}</div>
    <div class="guide-part ${k}"><h3>${step + 1}단계 · ${PART_LABELS[k]}</h3>

      <p class="small"><b>이렇게 시작해 보세요</b></p>${st[k].map((x) => `<div class="starter">✍️ ${esc(x)}</div>`).join("")}

/* ===================== 시상 ===================== */
function mingRate(doneSessions, limit = 10) {
  const list = doneSessions.filter((s) => s.awards && s.entries?.["밍"]?.result).sort((a, b) => a.createdAt - b.createdAt).slice(-limit);
  return { n: list.length, got: list.filter((s) => s.awards["밍"]).length };
}
function countBadges(done, id) {
  const n = { gold: 0, silver: 0, challenge: 0 };
  done.forEach((s) => { const a = s.awards?.[id]; if (a) n[a]++; });
  return n;
}
function computeAwards(session, pastDone) {
  const ranked = PEOPLE.filter((p) => session.entries[p.id]?.result)
    .map((p) => ({ id: p.id, score: session.entries[p.id].result.total, hw: session.entries[p.id].result.scores?.handwriting || 0 }))
    .sort((a, b) => b.score - a.score || b.hw - a.hw || (a.id === "밍" ? -1 : 1));
  const awards = {}; const notes = {};
  if (ranked[0]) awards[ranked[0].id] = "gold";
  if (ranked[1]) awards[ranked[1].id] = "silver";
  // 도전 배지 규칙
  const m = ranked.find((r) => r.id === "밍");
  if (m && !awards["밍"]) {
    const prev = mingRate(pastDone, 9);
    const needed = prev.got < Math.ceil(MING_TARGET * Math.min(10, prev.n + 1));
    if (m.score >= 60 || needed) { awards["밍"] = "challenge"; notes["밍"] = m.score >= 60 ? "자기 기준 60점 이상! 도전 배지" : "꾸준히 도전한 밍에게 도전 배지"; }
  }
  return { awards, ranked, notes };
}
function awardBox(s) {
  const n = PEOPLE.filter((p) => s.entries[p.id]?.result).length;
  if (s.status === "done") return "";
  return `<div class="card"><h2>🏆 시상식</h2>
    <p class="small muted">제출: ${PEOPLE.map((p) => `<span class="chip ${s.entries[p.id]?.result ? "done" : ""}">${p.id}${s.entries[p.id]?.result ? " ✓" : ""}</span>`).join("")}</p>
    <p class="small muted">${n < 3 ? "세 사람이 모두 제출하면 시상식을 열 수 있어요. (2명만 했어도 열 수 있지만, 안 낸 사람은 배지가 없어요)" : "모두 제출했어요! 두근두근 🥁"}</p>
    <button class="block" id="ceremony" ${n >= 2 ? "" : "disabled"}>🎉 시상식 열기</button></div>`;
}

  <div class="card"><h3>⚙️ 설정</h3><p class="small muted">저장소: ${remoteStore ? "가족 공용(모든 기기에서 같이 보임)" : "이 기기만"}</p><button class="line" id="logout">가족 코드 다시 넣기</button></div>`;
}

/* ===================== 렌더 & 이벤트 ===================== */
function loadingView(msg, emoji = "🤖") { return `<div class="card loading"><div class="big">${emoji}</div><p class="jua" style="font-size:20px">${esc(msg)}</p><div class="spinner"></div></div>`; }
async function render() {
  const app = $("#app");
  document.querySelectorAll("nav.bottom button").forEach((b) => b.classList.toggle("on", b.dataset.go === S.view));
  if (!familyCode || remoteStore === null) { app.innerHTML = viewCode(); return; }
  if (S.busy) { app.innerHTML = loadingView(S.busy, S.busyEmoji); return; }
  try {
    if (S.view === "home") app.innerHTML = await viewHome();
    else if (S.view === "badges") app.innerHTML = await viewBadges();
    else if (S.view === "history") app.innerHTML = await viewHistory();
    else if (S.view === "help") app.innerHTML = viewHelp();
    else if (S.view === "session") {
      const s = S.session;
      app.innerHTML = s.status === "interview" ? viewInterview() : s.status === "writing" ? viewWriting() : viewCeremony();
    }
  } catch (e) {
    app.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    if (e.status === 401) { familyCode = ""; ls.set("fwr_code", ""); setTimeout(render, 1500); }
  }
}
async function busy(msg, fn, emoji) {
  S.busy = msg; S.busyEmoji = emoji; setErr(""); render();
  try { await fn(); } catch (e) { setErr(e.message); } finally { S.busy = false; render(); }
}

/* 사진 줄이기 (긴 변 1600px, JPEG) */
function shrink(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const max = 1600; let { width: w, height: h } = img; const k = Math.min(1, max / Math.max(w, h));
      const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => reject(new Error("사진을 열 수 없어요. 다른 사진으로 해 주세요."));
    img.src = url;
  });
}
async function addPics(files) {
  const p = S.tab; S.pending = S.pending || {}; S.pending[p] = S.pending[p] || [];
  for (const f of files) { if (S.pending[p].length >= 4) break; S.pending[p].push(await shrink(f)); }
  render();
}

document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("button,[data-tab],[data-go]");
  if (!t) return;
  if (t.dataset.go) { S.view = t.dataset.go; setErr(""); return render(); }
  if (t.id === "codeOk") { const v = $("#codeIn").value; if (!v.trim()) return; setErr(""); try { await tryCode(v); } catch (e) { familyCode = ""; setErr(e.message); } return render(); }
  if (t.id === "logout") { familyCode = ""; remoteStore = null; ls.set("fwr_code", ""); return render(); }
  if (t.id === "startNew") { S.session = newSession(); S.tab = "밍"; S.view = "session"; await store.save(S.session); return render(); }
  if (t.dataset.open) { S.session = await store.get(t.dataset.open); S.view = "session"; S.tab = "밍"; return render(); }
  if (t.dataset.del) { if (confirm("이 기록을 삭제할까요? 배지도 같이 사라져요.")) { await store.remove(t.dataset.del); render(); } return; }
  if (t.dataset.tab) {
    if (S.session?.status === "interview") { collectAnswers(); store.save(S.session); }
    S.tab = t.dataset.tab; setErr(""); return render();
  }
  if (t.id === "makeTopic") {
    collectAnswers();
    const s = S.session;
    return busy("답변을 읽고 오늘의 주제를 고르는 중…", async () => {
      const recent = (await store.list()).filter((x) => x.topic).sort((a, b) => b.createdAt - a.createdAt).slice(0, 10).map((x) => x.topic.title);
      const answers = {};
      PEOPLE.forEach((p) => {
        const a = s.answers[p.id] || {};
        const qa = s.questions.filter((q) => (a[q.k] || "").trim()).map((q) => [q.q, a[q.k].trim()]);
        if (qa.length) answers[`${p.id}(${p.role}${p.level === "child" ? ", 초3" : ""})`] = Object.fromEntries(qa);
      });
      s.topic = await api("/api/ai", { task: "topic", answers, recentTopics: recent, date: s.date });
      s.status = "writing"; await store.save(s);
    }, "🤔");
  }
  if (t.dataset.bstep !== undefined) {
    const m = $("#memoIn"); const p = S.tab;
    if (m) { const key = `fwr_memo_${S.session.id}_${p}`; const memo = ls.get(key, {}); memo[m.dataset.memo] = m.value; ls.set(key, memo); }
    S.bstep = S.bstep || {}; S.bstep[p] = Number(t.dataset.bstep); return render();
  }
  if (t.id === "camBtn") return $("#camIn").click();
  if (t.id === "galBtn") return $("#galIn").click();
  if (t.id === "clearPics") { S.pending[S.tab] = []; return render(); }
  if (t.dataset.redo) { const s = S.session; delete s.entries[t.dataset.redo]; await store.save(s); return render(); }
  if (t.id === "submitPics") {
    const p = S.tab; const images = S.pending[p];
    return busy(`${p}의 글씨를 읽고 첨삭하는 중… (1분쯤 걸려요)`, async () => {
      const result = await api("/api/ai", { task: "judge", person: p, topic: S.session.topic, images });
      const fresh = (await store.get(S.session.id)) || S.session; // 다른 기기에서 낸 결과 합치기
      fresh.entries = { ...fresh.entries, [p]: { result, at: Date.now() } };
      S.session = fresh; await store.save(fresh); S.pending[p] = [];
    }, "👩‍🏫");
  }
  if (t.id === "ceremony") {
    return busy("점수를 모으는 중…", async () => {
      const all = await store.list();
      const fresh = all.find((x) => x.id === S.session.id) || S.session;
      const past = all.filter((x) => x.status === "done" && x.id !== fresh.id);
      const { awards, ranked, notes } = computeAwards(fresh, past);
      fresh.awards = awards; fresh.ranking = ranked; fresh.awardNotes = notes; fresh.status = "done";
      S.session = fresh; S.tab = ranked[0]?.id || "밍"; await store.save(fresh);
    }, "🥁");
  }
});
document.addEventListener("change", (ev) => {
  if (ev.target.id === "beginner") { ls.set("fwr_beginner_" + S.tab, ev.target.checked); render(); }
  if (ev.target.id === "camIn" || ev.target.id === "galIn") { const fs = [...ev.target.files]; ev.target.value = ""; addPics(fs).catch((e) => { setErr(e.message); render(); }); }
});
document.addEventListener("input", (ev) => {
  if (ev.target.id === "memoIn") { const key = `fwr_memo_${S.session.id}_${S.tab}`; const memo = ls.get(key, {}); memo[ev.target.dataset.memo] = ev.target.value; ls.set(key, memo); }
  if (ev.target.dataset.ans !== undefined) { const s = S.session; s.answers[S.tab] = s.answers[S.tab] || {}; s.answers[S.tab][ev.target.dataset.ans] = ev.target.value; }
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && ev.target.id === "codeIn") $("#codeOk").click(); });

(async () => {
  if (familyCode) { try { await tryCode(familyCode); } catch (e) { familyCode = ""; setErr(e.message); } }
  render();
})();
</script>
