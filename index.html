<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>또박이</title>
<meta name="theme-color" content="#fff7ec">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7ec; --card:#ffffff; --ink:#2b2622; --sub:#7a6f66; --line:#eadfce;
  --accent:#ff7a45; --accent-ink:#ffffff; --soft:#fff0e3; --good:#2f9e6b; --warn:#d9480f;
  --pearl:#e86a92; --wool:#3b82c4; --ming:#f59f00;
  --gold:#f5b301; --silver:#a9b4bf; --challenge:#3fb57a;
  --radius:18px; --shadow:0 4px 14px rgba(120,80,30,.10);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3,.jua{font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400;line-height:1.3}
h1{font-size:28px;margin:0}
h2{font-size:23px;margin:0 0 10px}
h3{font-size:19px;margin:0 0 6px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 96px}
header.top{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
header.top .robot{font-size:34px}
header.top .sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin:0 0 14px}
.muted{color:var(--sub)}
.small{font-size:14px}
button,.btn{font:inherit;border:0;border-radius:14px;padding:13px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-family:"Jua",sans-serif;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px}
button.ghost{background:var(--soft);color:var(--ink)}
button.line{background:transparent;border:2px solid var(--line);color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
button.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 auto}
input[type=text],input[type=password],textarea{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#fffdf9;color:var(--ink)}
textarea{min-height:72px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
label.q{display:block;margin:14px 0 6px;font-weight:700}
.tabs{display:flex;gap:8px;margin:0 0 12px}
.tab{flex:1;padding:10px 6px;border-radius:14px;background:var(--soft);color:var(--ink);font-family:"Jua";font-size:18px;text-align:center;cursor:pointer;border:3px solid transparent;min-height:auto}
.tab.on{border-color:currentColor;background:#fff}
.p-펄{color:var(--pearl)} .p-울{color:var(--wool)} .p-밍{color:var(--ming)}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--soft);font-size:14px;margin:2px 4px 2px 0}
.chip.done{background:#e3f6ec;color:var(--good)}
.steps{display:flex;gap:6px;margin:0 0 14px}
.steps span{flex:1;height:8px;border-radius:8px;background:var(--line)}
.steps span.on{background:var(--accent)}
.topic-title{font-size:26px;margin:4px 0 8px}
.badge-wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.badge-wrap svg{flex:0 0 auto}
.guide-part{border-left:6px solid var(--accent);padding:6px 0 6px 12px;margin:12px 0}
.guide-part.intro{border-color:#ff9f68}.guide-part.cause{border-color:#7c9cff}.guide-part.solution{border-color:#3fb57a}.guide-part.conclusion{border-color:#c77dff}
.starter{background:var(--soft);border-radius:10px;padding:6px 10px;margin:6px 0;font-size:15px}
.score-bar{height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.score-bar i{display:block;height:100%;background:var(--accent)}
.score-row{display:grid;grid-template-columns:110px 1fr 54px;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.transcript{white-space:pre-wrap;background:#fffdf6;border:2px dashed var(--line);border-radius:12px;padding:12px;font-size:16px}
.transcript mark{background:#ffd8a8;border-radius:4px}
.total{font-family:"Jua";font-size:40px;color:var(--accent)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.thumbs img{width:84px;height:110px;object-fit:cover;border-radius:10px;border:2px solid var(--line)}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:10px 0 4px;text-align:center}
.podium .pl{flex:1;max-width:200px}
.podium .stand{border-radius:12px 12px 0 0;color:#fff;font-family:"Jua";font-size:22px;padding:8px 0}
.grid-badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.grid-badges .b{text-align:center;font-size:13px;color:var(--sub)}
.notice{background:#fff3bf;border-radius:12px;padding:10px 12px;font-size:15px;margin:0 0 12px}
.err{background:#ffe3e3;color:#a61e1e;border-radius:12px;padding:10px 12px;font-size:15px;margin:10px 0}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:#fffaf3;border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.bottom button{flex:1;max-width:180px;background:transparent;color:var(--sub);font-size:15px;flex-direction:column;gap:0;min-height:52px;padding:4px}
nav.bottom button b{font-size:22px;line-height:1.1}
nav.bottom button.on{color:var(--accent)}
.spinner{display:inline-block;width:22px;height:22px;border:3px solid rgba(0,0,0,.12);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:26px 10px}
.loading .big{font-size:46px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.toggle{display:flex;align-items:center;gap:10px;background:var(--soft);padding:10px 12px;border-radius:12px;cursor:pointer}
.toggle input{width:22px;height:22px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:#fff;color:var(--ink);border:2px solid var(--line);font-family:"Gowun Dodum",sans-serif;font-size:16px;padding:8px 12px;min-height:42px;border-radius:999px;flex:0 0 auto}
.opt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.who{background:var(--soft);border-radius:12px;padding:8px 12px;font-size:15px;margin:4px 0 2px}
.event{background:linear-gradient(90deg,#fff3bf,#ffe8cc);border:2px solid #ffd43b;border-radius:14px;padding:10px 12px;margin:0 0 12px;font-size:15px}
.season-bar{display:flex;gap:4px;margin:0 0 12px}
.season-bar span{flex:1;height:10px;border-radius:6px;background:var(--line)}
.season-bar span.on{background:var(--gold)}
.srow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.wishbtn{background:#c77dff;font-size:14px;min-height:32px;padding:4px 10px;border-radius:999px;margin:2px 0}
.cx u{text-decoration:underline wavy #e03131;text-underline-offset:3px}
.cx sup,.cxn{color:#e03131;font-weight:700}
.memo{background:#f3f7ff;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:15px}
.memo .q,.mission .q{color:var(--sub);font-style:italic}
.mission{background:#e9f8ef;border-radius:12px;padding:10px 12px;margin:12px 0}
details.fix{background:var(--soft);border-radius:12px;padding:10px 12px;margin:10px 0}
details.fix summary{cursor:pointer;font-weight:700}
.stbl{width:100%;border-collapse:collapse;font-size:15px;text-align:center}
.stbl th{font-weight:400;color:var(--sub);font-size:13px;padding:4px 2px}
.stbl td{padding:7px 2px;border-top:1px solid var(--line)}
nav.bottom button{min-width:0}
ul.clean{margin:6px 0;padding-left:20px}
@media (max-width:420px){ h1{font-size:24px} .topic-title{font-size:22px} .score-row{grid-template-columns:92px 1fr 48px} }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
/* ===================== 기본 설정 ===================== */

/* 객관식 질문 (날씨·기분 + 매번 다른 3개) */
const MC_FIXED = [
  { q: "오늘 날씨는 어땠나요?", o: ["☀️ 맑음", "☁️ 흐림", "🌧️ 비", "❄️ 눈", "🥶 아주 추움"] },

/* 주관식 질문 (매번 다른 1개 + 자유 이야기) */

const POOL_Q = [
  "요즘 가장 관심 있는 것은 무엇인가요?",
  "요즘 불편하거나 속상했던 일이 있었나요?",
  "이번 주에 가장 기억에 남는 일은 무엇인가요?",

  "우리 집에서 바뀌었으면 하는 점이 있나요?",
  "학교나 회사, 동네에서 '이건 문제야!' 하고 느낀 일이 있나요?",
  "요즘 가족에게 고마웠던 일이나 서운했던 일은 무엇인가요?",
  "요즘 자주 하는 놀이나 취미는? 그러다 생긴 문제는 없었나요?",
  "뉴스나 책에서 본 이야기 중 기억나는 것이 있나요?",
  "겨울이라서 좋은 점이나 힘든 점은 무엇인가요?",

];
const STARTERS = {
  child: {
    intro: ["요즘 ○○ 때문에 문제가 생겼다.", "나는 이 문제를 보고 ○○한 기분이 들었다.", "그래서 이 문제의 까닭과 해결 방법을 생각해 보았다."],
    cause: ["이 문제가 생긴 까닭은 첫째, ○○ 때문이다.", "둘째, ○○ 때문이다."],

    conclusion: ["정리하면, ○○.", "앞으로 나는 이 문제가 다시 생기지 않도록 ○○하겠다."],

    cause: ["가장 근본적인 원인은 ○○이다.", "여기에 ○○라는 요인이 더해졌다."],
    solution: ["첫째, ○○해야 한다. 그 이유는 ○○이다.", "둘째, ○○. 예컨대 ○○."],
    conclusion: ["요컨대 ○○.", "같은 문제가 반복되지 않도록 앞으로 ○○하겠다."],
  },

/* ===================== 유틸 ===================== */
const $ = (s, el = document) => el.querySelector(s);
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function seededPick(arr, n, seed) {
  let h = 0; for (const c of seed) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { h = (h * 1103515245 + 12345) >>> 0; const j = h % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, n);
}

/* ===================== 서버 통신 ===================== */
let familyCode = ls.get("fwr_code", "");
let remoteStore = null; // true: 가족 공용 저장소, false: 이 기기만
async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...body, code: familyCode }) });
  let data = {};
  try { data = await r.json(); } catch { throw new Error(r.status === 413 ? "사진이 너무 커요. 사진 수를 줄여 주세요." : `서버 응답 오류 (${r.status})`); }
  if (!r.ok) { const e = new Error(data.error || `오류 (${r.status})`); e.status = r.status; throw e; }
  return data;
}

function newSession(info) {
  const date = todayStr(); const seed = date + Math.random();
  const mc = [...MC_FIXED, ...seededPick(MC_POOL, 3, seed)].map((x, i) => ({ k: "m" + i, type: "mc", q: x.q, o: x.o }));
  const tx = [{ k: "t0", type: "text", q: seededPick(POOL_Q, 1, seed + "t")[0] }, { k: "t1", type: "text", q: TEXT_FREE }];
  return {
    id: date + "-" + Math.random().toString(36).slice(2, 7), date, status: "interview", questions: [...mc, ...tx],
    answers: {}, topic: null, entries: {}, awards: null, event: rollEvent(info), createdAt: Date.now(),
  };
}

/* ===================== 시즌 ===================== */
function seasonSessions(all) {
  return all.filter((s) => s.status === "done" && s.season).sort((a, b) => a.createdAt - b.createdAt);
}
function standings(games) {
  const points = {}, medals = {};
  PEOPLE.forEach((p) => { points[p.id] = 0; medals[p.id] = { gold: 0, silver: 0, bronze: 0 }; });
  games.forEach((s) => PEOPLE.forEach((p) => {
    points[p.id] += s.points?.[p.id] || 0;
    const m = s.medals?.[p.id]; if (m) medals[p.id][m]++;
  }));
  return { points, medals };
}
function seasonInfo(all) {
  const done = seasonSessions(all);
  const last = done.length ? Math.max(...done.map((s) => s.season)) : 1;
  const lastGames = done.filter((s) => s.season === last).length;
  const season = lastGames >= SEASON_GAMES ? last + 1 : last;
  const games = done.filter((s) => s.season === season);
  return { season, played: games.length, remaining: SEASON_GAMES - games.length, games, ...standings(games) };
}
function trophies(all) {
  const done = seasonSessions(all); const list = [];
  const seasons = [...new Set(done.map((s) => s.season))].sort((a, b) => a - b);
  seasons.forEach((n) => {
    const games = done.filter((s) => s.season === n);
    if (games.length < SEASON_GAMES) return;
    const { points } = standings(games);
    const top = Math.max(...Object.values(points));
    list.push({ season: n, winners: PEOPLE.filter((p) => points[p.id] === top).map((p) => p.id), points });
  });
  return list;
}
/* 뒤처진 사람이 20점에 못 미칠 것 같으면 가끔 2배·3배 경기 */
function rollEvent(info) {
  if (!info || info.played < 3 || info.remaining <= 0) return null;
  const r = info.remaining;
  const behind = PEOPLE.some((p) => info.points[p.id] + r * 2 < WISH_POINTS);
  if (!behind) return null;
  const hopeless = PEOPLE.some((p) => info.points[p.id] + r * 3 < WISH_POINTS);
  if (Math.random() >= (hopeless ? 0.6 : 0.35)) return null;
  return { mult: hopeless && Math.random() < 0.6 ? 3 : 2 };
}
function eventBanner(s) {
  if (!s.event?.mult) return "";
  return `<div class="event">🎉 오늘은 <b>${s.event.mult}배 점수 경기!</b> 메달 점수가 ${s.event.mult}배가 돼요 (금 ${3 * s.event.mult} · 은 ${2 * s.event.mult} · 동 ${s.event.mult}점)</div>`;
}

/* 모든 시즌에서 받은 소원권 (사용 전/후) */
function allWishes(all, m) {
  const done = seasonSessions(all); const out = [];
  [...new Set(done.map((s) => s.season))].sort((a, b) => a - b).forEach((n) => {
    const { points } = standings(done.filter((s) => s.season === n));
    PEOPLE.forEach((p) => {
      for (let i = 0; i < Math.floor(points[p.id] / WISH_POINTS); i++) out.push({ season: n, id: p.id, i, used: m.wishes?.[`${n}-${p.id}-${i}`] || null });
    });
  });
  return out;
}
function wishCards(info, m) {
  return PEOPLE.map((p) => {
    const pts = info.points[p.id]; const earned = Math.floor(pts / WISH_POINTS);
    const used = Array.from({ length: earned }, (_, i) => m.wishes?.[`${info.season}-${p.id}-${i}`]);
    const toNext = WISH_POINTS - (pts % WISH_POINTS);
    return { p, pts, earned, used, toNext };
  });
}

const CIRCLED = "①②③④⑤⑥⑦⑧⑨⑩";
function markedTranscript(r) {
  let html = esc(r.transcript || "");
  (r.corrections || []).forEach((c, i) => {
    const f = esc(c.from || "").trim(); if (!f) return;
    const at = html.indexOf(f); if (at < 0) return;
    html = html.slice(0, at) + `<span class="cx"><u>${f}</u><sup>${CIRCLED[i] || i + 1}</sup></span>` + html.slice(at + f.length);
  });
  return html.replace(/\[\?\]/g, "<mark>[?]</mark>");
}
function correctionList(r) {
  return `<ul class="clean">${r.corrections.map((c, i) => `<li><b class="cxn">${CIRCLED[i] || i + 1}</b> <s>${esc(c.from)}</s> → <b>${esc(c.to)}</b> ${c.type ? `<span class="chip">${esc(c.type)}</span>` : ""}<span class="small muted">${esc(c.why)}</span></li>`).join("")}</ul>`;
}
function sortComments(list) {
  const order = { intro: 0, cause: 1, solution: 2, conclusion: 3, whole: 4 };
  return list.slice().sort((a, b) => (order[a.part] ?? 5) - (order[b.part] ?? 5));
}

/* ===================== 시상 ===================== */
function scoreStats(done, id) {
  const list = done.filter((s) => s.entries?.[id]?.result).sort((a, b) => (a.date || "").localeCompare(b.date || "") || a.createdAt - b.createdAt);
  const totals = list.map((s) => s.entries[id].result.total || 0);
  const sum = totals.reduce((a, b) => a + b, 0);
  const cat = {};
  Object.keys(SCORE_LABELS).forEach((k) => {
    cat[k] = list.length ? list.reduce((a, s) => a + (s.entries[id].result.scores?.[k] || 0), 0) / list.length : 0;
  });
  return { n: list.length, sum, avg: list.length ? Math.round((sum / list.length) * 10) / 10 : 0, best: totals.length ? Math.max(...totals) : 0, list, cat };
}
function countBadges(done, id) {
  const n = { gold: 0, silver: 0, bronze: 0, badges: 0 };
  done.forEach((s) => { const m = s.medals?.[id]; if (m) n[m]++; if (s.awards?.[id] === "gold") n.badges++; });
  return n;
}
/* 점수 순위 → 금·은·동 메달, 배지는 금메달만, 시즌 점수 = 메달 점수 × 이벤트 배수 */
function computeMedals(session, history = []) {
  const ranked = PEOPLE.filter((p) => session.entries[p.id]?.result)
    .map((p) => ({ id: p.id, score: session.entries[p.id].result.total, hw: session.entries[p.id].result.scores?.handwriting || 0 }))
    .sort((a, b) => b.score - a.score || b.hw - a.hw || (a.id === "밍" ? -1 : 1));
  const k = ranked.findIndex((r) => r.id === "밍");
  if (k > 0) {
    const h = history.filter((s) => s.medals?.["밍"]).sort((a, b) => a.createdAt - b.createdAt).slice(-9);
    if (h.filter((s) => s.medals["밍"] === "gold").length < Math.ceil((h.length + 1) / 2)) ranked.unshift(ranked.splice(k, 1)[0]);
  }
  const order = ["gold", "silver", "bronze"]; const mult = session.event?.mult || 1;
  const medals = {}, points = {}, awards = {};
  ranked.forEach((r, i) => { medals[r.id] = order[i]; points[r.id] = MEDAL_POINTS[order[i]] * mult; });
  if (ranked[0]) awards[ranked[0].id] = "gold";
  return { ranked, medals, points, awards };
}

    🧞 시즌 점수 ${WISH_POINTS}점을 모으면 소원 하나를 이룰 수 있어요.<br>
    🏆 시즌이 끝났을 때 점수가 가장 높은 사람은 우승 트로피를 받아요.<br>
    🎉 가끔 깜짝 2배·3배 점수 경기가 열려요!</p>
  </div>
  <div class="card"><h3>⚙️ 설정</h3><p class="small muted">저장소: ${remoteStore ? "가족 공용(모든 기기에서 같이 보임)" : "이 기기만"}</p><button class="line" id="logout">가족 코드 다시 넣기</button></div>`;
}

/* ===================== 렌더 & 이벤트 ===================== */
function loadingView(msg, emoji = "🤖") { return `<div class="card loading"><div class="big">${emoji}</div><p class="jua" style="font-size:20px">${esc(msg)}</p><div class="spinner"></div></div>`; }
async function render() {
  const app = $("#app");
  document.querySelectorAll("nav.bottom button").forEach((b) => b.classList.toggle("on", b.dataset.go === S.view));
  if (!familyCode || remoteStore === null) { app.innerHTML = viewCode(); return; }
  if (S.busy) { app.innerHTML = loadingView(S.busy, S.busyEmoji); return; }
  try {
    if (S.view === "home") app.innerHTML = await viewHome();
    else if (S.view === "badges") app.innerHTML = await viewBadges();
    else if (S.view === "scores") app.innerHTML = await viewScores();
    else if (S.view === "history") app.innerHTML = await viewHistory();
    else if (S.view === "help") app.innerHTML = viewHelp();
    else if (S.view === "session") {
      const s = S.session;
      app.innerHTML = s.status === "interview" ? viewInterview() : s.status === "writing" ? viewWriting() : viewCeremony();
    }
  } catch (e) {
    app.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    if (e.status === 401) { familyCode = ""; ls.set("fwr_code", ""); setTimeout(render, 1500); }
  }
}
async function busy(msg, fn, emoji) {
  S.busy = msg; S.busyEmoji = emoji; setErr(""); render();
  try { await fn(); } catch (e) { setErr(e.message); } finally { S.busy = false; render(); }
}

/* 사진 줄이기 (긴 변 1600px, JPEG) */
function shrink(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const max = 1600; let { width: w, height: h } = img; const k = Math.min(1, max / Math.max(w, h));
      const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => reject(new Error("사진을 열 수 없어요. 다른 사진으로 해 주세요."));
    img.src = url;
  });
}
async function addPics(files) {
  const p = S.tab; S.pending = S.pending || {}; S.pending[p] = S.pending[p] || [];
  for (const f of files) { if (S.pending[p].length >= 4) break; S.pending[p].push(await shrink(f)); }
  render();
}

document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("button,[data-tab],[data-go]");
  if (!t) return;
  if (t.dataset.go) { S.view = t.dataset.go; setErr(""); return render(); }
  if (t.id === "codeOk") { const v = $("#codeIn").value; if (!v.trim()) return; setErr(""); try { await tryCode(v); } catch (e) { familyCode = ""; setErr(e.message); } return render(); }
  if (t.id === "logout") { familyCode = ""; remoteStore = null; ls.set("fwr_code", ""); return render(); }
  if (t.id === "startNew") { const info = seasonInfo(await store.list()); S.session = newSession(info); S.tab = "밍"; S.view = "session"; await store.save(S.session); return render(); }
  if (t.dataset.mc) {
    collectAnswers();
    const s = S.session; const a = (s.answers[S.tab] = s.answers[S.tab] || {});
    a[t.dataset.mc] = a[t.dataset.mc] === t.dataset.v ? "" : t.dataset.v;
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (t.dataset.wish) {
    const [season, id, i] = t.dataset.wish.split("-");
    const text = prompt(`${id}의 소원은 무엇인가요? (예: 주말에 놀이공원 가기)`);
    if (!text || !text.trim()) return;
    const m = await meta.get();
    m.wishes = m.wishes || {}; m.wishes[`${season}-${id}-${i}`] = { text: text.trim().slice(0, 100), at: Date.now() };
    await meta.set(m); return render();
  }
  if (t.dataset.open) { S.session = await store.get(t.dataset.open); S.view = "session"; S.tab = "밍"; return render(); }
  if (t.dataset.del) {
    const msg = t.dataset.inprogress ? "진행 중인 글쓰기를 삭제할까요? 인터뷰 답과 제출한 글이 모두 지워져요." : "이 기록을 삭제할까요? 배지도 같이 사라져요.";
    if (confirm(msg)) { await store.remove(t.dataset.del); render(); }
    return;
  }
  if (t.dataset.tab) {
    if (S.session?.status === "interview") { collectAnswers(); store.save(S.session); }
    S.tab = t.dataset.tab; setErr(""); return render();
  }
  if (t.id === "makeTopic") {
    collectAnswers();
    const s = S.session;
    return busy("답변을 읽고 오늘의 주제를 고르는 중…", async () => {
      const recent = (await store.list()).filter((x) => x.topic).sort((a, b) => b.createdAt - a.createdAt).slice(0, 10).map((x) => x.topic.title);
      const answers = {};
      PEOPLE.forEach((p) => {
        const a = s.answers[p.id] || {};
        const qa = s.questions.filter((q) => (a[q.k] || "").trim()).map((q) => [q.q, a[q.k].trim()]);
        if (qa.length) answers[`${p.id}(${p.role}${p.level === "child" ? ", 초3" : ""})`] = Object.fromEntries(qa);
      });
      s.topic = await api("/api/ai", { task: "topic", answers, recentTopics: recent, date: s.date });
      s.status = "writing"; await store.save(s);
    }, "🤔");
  }
  if (t.dataset.bstep !== undefined) {
    const m = $("#memoIn"); const p = S.tab;
    if (m) { const key = `fwr_memo_${S.session.id}_${p}`; const memo = ls.get(key, {}); memo[m.dataset.memo] = m.value; ls.set(key, memo); }
    S.bstep = S.bstep || {}; S.bstep[p] = Number(t.dataset.bstep); return render();
  }
  if (t.id === "camBtn") return $("#camIn").click();
  if (t.id === "galBtn") return $("#galIn").click();
  if (t.id === "clearPics") { S.pending[S.tab] = []; return render(); }
  if (t.dataset.redo) { const s = S.session; delete s.entries[t.dataset.redo]; await store.save(s); return render(); }
  if (t.id === "submitPics") {
    const p = S.tab; const images = S.pending[p];
    return busy(`${p}의 글씨를 읽고 첨삭하는 중… (1분쯤 걸려요)`, async () => {
      const prev = (await store.list()).filter((x) => x.status === "done" && x.id !== S.session.id && x.entries?.[p]?.result?.next_mission)
        .sort((a, b) => b.createdAt - a.createdAt)[0];
      const prevMission = prev ? prev.entries[p].result.next_mission : "";
      const result = await api("/api/ai", { task: "judge", person: p, topic: S.session.topic, images, prevMission });
      const fresh = (await store.get(S.session.id)) || S.session; // 다른 기기에서 낸 결과 합치기
      fresh.entries = { ...fresh.entries, [p]: { result, at: Date.now() } };
      S.session = fresh; await store.save(fresh); S.pending[p] = [];
    }, "👩‍🏫");
  }
  if (t.id === "ceremony") {
    await busy("점수를 모으는 중…", async () => {
      const all = await store.list();
      const fresh = all.find((x) => x.id === S.session.id) || S.session;
      if (fresh.status === "done") { S.session = fresh; return; } // 다른 기기에서 이미 시상함
      const before = seasonInfo(all.filter((x) => x.id !== fresh.id));
      const { ranked, medals, points, awards } = computeMedals(fresh, all.filter((x) => x.status === "done" && x.id !== fresh.id));
      Object.assign(fresh, { ranking: ranked, medals, points, awards, season: before.season, game: before.played + 1, status: "done" });
      await store.save(fresh);
      const after = seasonInfo([...all.filter((x) => x.id !== fresh.id), fresh]);
      const complete = before.played + 1 >= SEASON_GAMES;
      const cur = complete ? standings(seasonSessions([...all.filter((x) => x.id !== fresh.id), fresh]).filter((x) => x.season === before.season)) : after;
      const top = Math.max(...Object.values(cur.points));
      S.seasonResult = {
        id: fresh.id, season: before.season, played: before.played + 1, complete, points: cur.points, medals: cur.medals,
        winners: PEOPLE.filter((p) => cur.points[p.id] === top).map((p) => p.id),
        newWishes: PEOPLE.filter((p) => Math.floor(cur.points[p.id] / WISH_POINTS) > Math.floor(before.points[p.id] / WISH_POINTS)).map((p) => p.id),
      };
      S.session = fresh; S.tab = ranked[0]?.id || "밍";
    }, "🥁");
    if (S.session?.status === "done" && S.seasonResult?.id === S.session.id) archiveSession(S.session, true); // 블로그 올리기 + 메일 (뒤에서 진행)
    return;
  }
  if (t.dataset.href) { window.open(t.dataset.href, "_blank"); return; }
  if (t.dataset.blog) { window.open(`/blog.html?id=${encodeURIComponent(t.dataset.blog)}`, "_blank"); return; }
  if (t.dataset.print || t.dataset.pdf || t.dataset.mail) {
    const id = t.dataset.print || t.dataset.pdf || t.dataset.mail;
    const s = S.session?.id === id ? S.session : await store.get(id);
    if (!s) return;
    if (t.dataset.print) return printA5(postFromSession(s));
    if (t.dataset.pdf) { try { await a5PdfBase64(postFromSession(s), { save: true }); } catch (e) { alert(e.message); } return; }
    return archiveSession(s, true);
  }
});

/* ===================== 블로그 올리기 · A5 인쇄 · 메일 ===================== */
S.doc = {};
function mailHTML(post) {
  const link = `${location.origin}/blog.html?id=${encodeURIComponent(post.id)}`;
  return `<p>${ROBOT_NAME}가 오늘의 가족 글쓰기를 보내 드려요. 첨부한 A5 PDF를 인쇄해서 연습장에 붙여 두세요. 📒</p>
    <p>블로그에서 보기: <a href="${link}">${link}</a></p>${postBodyHTML(post)}`;
}
async function archiveSession(s, mail) {
  const st = (S.doc[s.id] = { blog: "📰 블로그에 올리는 중…", mail: mail ? "📄 A5 PDF 만드는 중…" : "" });
  render();
  const post = postFromSession(s);
  try {
    if (!remoteStore) throw new Error("가족 공용 저장소가 연결되지 않아 블로그에 올리지 못했어요.");
    await api("/api/data", { action: "publish", post });
    st.blog = "✅ 블로그에 올렸어요 (기록을 지워도 블로그 글은 남아요)";
    s.published = true; await store.save(s);
  } catch (e) { st.blog = "❌ " + e.message; }
  render();
  if (!mail) return;
  try {
    const pdf = await a5PdfBase64(post);
    st.mail = "📧 메일 보내는 중…"; render();
    await api("/api/mail", { subject: `[${ROBOT_NAME}] ${post.date} ${post.topic.title}`, html: mailHTML(post), pdf, filename: `${post.date}_${post.topic.title}.pdf` });
    st.mail = "✅ A5 PDF를 메일로 보냈어요";
  } catch (e) {
    st.mail = /메일 설정/.test(e.message) ? "📧 메일 설정이 아직 안 되어 있어요 (PDF 저장 버튼으로 받을 수 있어요)" : "❌ " + e.message;
  }
  render();
}
function printA5(post) {
  const w = window.open("", "_blank");
  if (!w) { alert("팝업이 막혀 있어요. 팝업을 허용해 주세요."); return; }
  w.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>${esc(post.date)} ${esc(post.topic.title)}</title>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    <style>${A5_CSS} body{margin:0;background:#eee} @media screen{.a5page{margin:10px auto;box-shadow:0 2px 8px rgba(0,0,0,.15)}}</style></head>
    <body>${a5HTML(post)}<script>(document.fonts?document.fonts.ready:Promise.resolve()).then(function(){setTimeout(function(){print()},400)})<\/script></body></html>`);
  w.document.close();
}
function archiveCard(s) {
  const st = S.doc[s.id] || {};
  return `<div class="card"><h3>📦 기록 보관</h3>
    <p class="small">${esc(st.blog || (s.published ? "✅ 블로그에 올라가 있어요" : ""))}${st.mail ? "<br>" + esc(st.mail) : ""}</p>
    <div class="row"><button class="ghost" data-blog="${esc(s.id)}">📰 블로그 보기</button><button class="ghost" data-print="${esc(s.id)}">🖨️ A5 인쇄</button></div>
    <div class="row" style="margin-top:8px"><button class="line" data-pdf="${esc(s.id)}">⬇️ PDF 저장</button><button class="line" data-mail="${esc(s.id)}">📧 다시 올리고 메일</button></div>
  </div>`;
}
document.addEventListener("change", (ev) => {
  if (ev.target.id === "beginner") { ls.set("fwr_beginner_" + S.tab, ev.target.checked); render(); }
  if (ev.target.id === "camIn" || ev.target.id === "galIn") { const fs = [...ev.target.files]; ev.target.value = ""; addPics(fs).catch((e) => { setErr(e.message); render(); }); }
});
document.addEventListener("input", (ev) => {
  if (ev.target.id === "memoIn") { const key = `fwr_memo_${S.session.id}_${S.tab}`; const memo = ls.get(key, {}); memo[ev.target.dataset.memo] = ev.target.value; ls.set(key, memo); }
  if (ev.target.dataset.ans !== undefined) { const s = S.session; s.answers[S.tab] = s.answers[S.tab] || {}; s.answers[S.tab][ev.target.dataset.ans] = ev.target.value; }
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && ev.target.id === "codeIn") $("#codeOk").click(); });

(async () => {
  if (familyCode) { try { await tryCode(familyCode); } catch (e) { familyCode = ""; setErr(e.message); } }
  render();
})();
</script>
